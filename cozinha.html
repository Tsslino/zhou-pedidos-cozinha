<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COZINHA | ZHOU CLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #020202; color: #fff; font-family: 'Inter', sans-serif; }
        .item-card { background: #0a0a0a; border: 1px solid #161616; border-radius: 15px; }
        .item-card.selected { border-color: #ff0000; background: #110000; }
        .qty-btn { background: #161616; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #444; border-bottom: 2px solid #161616; }
        .tab-btn.active { color: #ff0000; border-bottom-color: #ff0000; }
        #alarm-overlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; }
        .pulse-red { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
    </style>
</head>
<body class="p-4 pb-24">

    <div id="alarm-overlay" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center p-6 text-center">
        <div class="w-32 h-32 bg-red-600 rounded-full flex items-center justify-center mb-6 pulse-red">
            <span class="text-4xl">⏰</span>
        </div>
        <h2 class="text-2xl font-black italic mb-2">HORA DE CONFERIR!</h2>
        <p class="text-zinc-500 text-sm mb-8 uppercase font-bold tracking-widest">Verifique os itens que estão faltando</p>
        <button onclick="stopAlarm()" class="w-full bg-white text-black font-black py-5 rounded-2xl uppercase">Entendido / Silenciar</button>
    </div>

    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-black italic leading-none">ZHOU <span class="text-red-600">COZINHA</span></h1>
            <p id="nome-loja" class="text-[10px] text-zinc-500 font-bold uppercase mt-1">Carregando...</p>
        </div>
        <button id="audio-unlock" onclick="unlockAudio()" class="bg-zinc-900 px-3 py-2 rounded-lg text-[9px] font-black text-red-500 animate-bounce">🔈 ATIVAR SOM</button>
    </header>

    <nav class="flex mb-6 bg-[#0a0a0a] rounded-t-xl overflow-hidden">
        <div onclick="setTab('enviar')" id="tab-enviar" class="tab-btn active">Solicitar</div>
        <div onclick="setTab('pendentes')" id="tab-pendentes" class="tab-btn">Faltas</div>
    </nav>

    <section id="sec-enviar" class="space-y-4">
        <div class="flex gap-2">
            <input type="text" id="solicitante" placeholder="TEU NOME" class="bg-[#0a0a0a] border border-[#161616] p-4 rounded-xl font-bold text-xs w-1/3">
            <select id="filtro-fornecedor" onchange="renderizarCatalogo()" class="flex-1 bg-[#0a0a0a] border border-[#161616] p-4 rounded-xl font-bold text-xs">
                <option value="">TODAS CATEGORIAS</option>
            </select>
        </div>
        <div id="catalogo" class="grid grid-cols-1 gap-2"></div>
    </section>

    <section id="sec-pendentes" class="hidden space-y-3">
        <div id="lista-faltas" class="space-y-2"></div>
    </section>

    <div class="fixed bottom-0 left-0 w-full p-4 bg-black/80 backdrop-blur-lg border-t border-zinc-900 flex gap-2">
        <button onclick="enviarTudo()" id="btn-main" class="flex-1 bg-red-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs tracking-widest">
            Enviar (<span id="count-total">0</span>)
        </button>
    </div>

    <audio id="audio-player" loop>
        <source id="audio-source" src="" type="audio/mpeg">
    </audio>

    <script>
        const sb = supabase.createClient("https://jxwxvzvxaabzoajdhetw.supabase.co", "sb_publishable_MFyO9fL-XKBzrVC0SRBOuw_bqghFOzF");
        const params = new URLSearchParams(window.location.search);
        const unidadeId = params.get('loja');
        
        let itensSelecionados = {};
        let fornecedoresData = [];
        let configAlarme = { hora: "", toque: "" };

        async function init() {
            if(!unidadeId) return alert("Erro: ID da Loja faltando!");
            
            const { data: u } = await sb.from('unidades').select('nome').eq('id', unidadeId).single();
            if(u) document.getElementById('nome-loja').innerText = u.nome;

            const { data: f } = await sb.from('fornecedores').select('*').order('nome');
            fornecedoresData = f || [];
            
            const selectF = document.getElementById('filtro-fornecedor');
            f.forEach(forn => selectF.innerHTML += `<option value="${forn.id}">${forn.nome}</option>`);

            renderizarCatalogo();
            syncAlarme();
            setInterval(checkAlarme, 30000); // Checa a cada 30 segundos
        }

        async function syncAlarme() {
            const { data } = await sb.from('configuracoes').select('*').eq('id', 1).single();
            if(data) {
                configAlarme.hora = data.lembrete_hora;
                configAlarme.toque = data.toque_url;
                document.getElementById('audio-source').src = data.toque_url;
                document.getElementById('audio-player').load();
            }
        }

        function checkAlarme() {
            const agora = new Date();
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
            
            if(horaAtual === configAlarme.hora) {
                startAlarm();
            }
        }

        function startAlarm() {
            const player = document.getElementById('audio-player');
            player.play().catch(() => console.log("Áudio bloqueado pelo browser"));
            document.getElementById('alarm-overlay').style.display = 'flex';
        }

        function stopAlarm() {
            document.getElementById('audio-player').pause();
            document.getElementById('alarm-overlay').style.display = 'none';
        }

        function unlockAudio() {
            document.getElementById('audio-player').play().then(() => {
                document.getElementById('audio-player').pause();
                document.getElementById('audio-unlock').classList.add('hidden');
                alert("Som Ativado! O alarme tocará no horário programado.");
            });
        }

        function renderizarCatalogo() {
            const fId = document.getElementById('filtro-fornecedor').value;
            const container = document.getElementById('catalogo');
            container.innerHTML = '';

            let lista = fId ? fornecedoresData.filter(x => x.id == fId) : fornecedoresData;

            lista.forEach(forn => {
                forn.itens.forEach(item => {
                    const nome = item.nome.toUpperCase();
                    const qty = itensSelecionados[nome] || 0;
                    container.innerHTML += `
                        <div class="item-card p-4 flex justify-between items-center ${qty > 0 ? 'selected' : ''}">
                            <div class="flex-1">
                                <p class="text-[9px] font-black text-zinc-600 mb-1 uppercase">${forn.nome}</p>
                                <p class="text-xs font-bold">${nome}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <button onclick="upd('${nome}', -1)" class="qty-btn text-zinc-500">-</button>
                                <span class="w-4 text-center font-black">${qty}</span>
                                <button onclick="upd('${nome}', 1)" class="qty-btn text-red-600 font-black">+</button>
                            </div>
                        </div>`;
                });
            });
        }

        function upd(n, v) {
            let q = (itensSelecionados[n] || 0) + v;
            if(q <= 0) delete itensSelecionados[n]; else itensSelecionados[n] = q;
            document.getElementById('count-total').innerText = Object.values(itensSelecionados).reduce((a,b)=>a+b,0);
            renderizarCatalogo();
        }

        async function enviarTudo() {
            const sol = document.getElementById('solicitante').value.toUpperCase();
            if(!sol) return alert("Identifica-te!");
            const chaves = Object.keys(itensSelecionados);
            if(!chaves.length) return alert("Seleciona algo!");

            const dados = chaves.map(n => ({
                unidade_id: unidadeId, item_nome: n, quantidade: itensSelecionados[n], solicitante: sol, status: 'pendente'
            }));

            const { error } = await sb.from('faltas').insert(dados);
            if(!error) {
                alert("ENVIADO!");
                itensSelecionados = {};
                document.getElementById('count-total').innerText = "0";
                renderizarCatalogo();
            }
        }

        function setTab(t) {
            document.getElementById('sec-enviar').classList.toggle('hidden', t !== 'enviar');
            document.getElementById('sec-pendentes').classList.toggle('hidden', t !== 'pendentes');
            document.getElementById('tab-enviar').classList.toggle('active', t === 'enviar');
            document.getElementById('tab-pendentes').classList.toggle('active', t === 'pendentes');
            if(t === 'pendentes') carregarPendentes();
        }

        async function carregarPendentes() {
            const { data } = await sb.from('faltas').select('*').eq('unidade_id', unidadeId).eq('status', 'pendente').order('id', {ascending: false});
            document.getElementById('lista-faltas').innerHTML = data.length ? data.map(i => `
                <div class="bg-[#0a0a0a] p-4 rounded-xl border-l-2 border-amber-600 flex justify-between">
                    <span class="text-xs font-bold">${i.quantidade}x ${i.item_nome}</span>
                    <span class="text-[8px] text-amber-500 font-bold uppercase">Pendente</span>
                </div>`).join('') : '<p class="text-center py-10 text-zinc-800 font-bold">TUDO OK</p>';
        }

        window.onload = init;
    </script>
</body>
</html>
